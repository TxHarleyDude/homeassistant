script:
  turn_on_pandora:
    alias: "Turn on Pandora"
    sequence:
    - action: media_player.play_media
      target:
        entity_id: media_player.living_room_roku
      data:
        media_content_id: "28"
        media_content_type: app
    - action: remote.send_command
      data:
        device: LG Soundbar
        command: power
      target:
        entity_id: remote.living_room

  tun_off_roku:
    alias: "Turn off Roku"
    sequence:
    - action: media_player.turn_off
      target:
        entity_id: media_player.living_room_roku
