automation:
  - id: water_pump_charger_on
    alias: Water Pump Charger On
    trigger:
      - trigger: time
        at: "02:00:00"
    condition:
      - condition: time
        weekday:
          - mon
    action:
      - action: switch.turn_on
        entity_id: switch.water_pump_outlet

  - id: water_pump_charger_off
    alias: Water Pump Charger Off
    mode: single
    trigger:
      - trigger: state
        entity_id: switch.water_pump_outlet
        to: "on"
        for: "1:00:00"
    condition:
      - condition: state
        entity_id: switch.water_pump_outlet
        state: "on"
    action:
      - action: switch.turn_off
        target:
          entity_id: switch.water_pump_outlet
