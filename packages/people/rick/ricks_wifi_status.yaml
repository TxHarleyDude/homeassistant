automation:
  - id: ricks_wifi_status
    alias: "Rick's WiFi status"
    initial_state: true
    trigger:
      - trigger: state
        entity_id: sensor.ricks_iphone_ssid
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ 'SLYFOX' in states('sensor.ricks_iphone_ssid') }}"
            sequence:
              - action: mqtt.publish
                data:
                  topic: location/ricks_wifi
                  payload: "home"
                  retain: true
        default:
          - action: mqtt.publish
            data:
              topic: location/ricks_wifi
              payload: "not_home"
              retain: true
