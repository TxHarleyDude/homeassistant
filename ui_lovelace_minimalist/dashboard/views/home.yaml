title: "Home"
path: "home"
cards:
  - type: "custom:button-card"
    template: "card_esh_welcome"
    triggers_update: "input_boolean.welcome_toggle"
    variables:
      ulm_card_esh_welcome_collapse: input_boolean.welcome_toggle
      ulm_weather: "weather.home"
      entity_1:
        nav: "house"
        icon: "mdi:home"
        name: "Home"
        color: "blue"
      entity_2:
        nav: "lights"
        icon: "mdi:lightbulb"
        name: "Lights"
        color: "yellow"
      entity_3:
        nav: "security"
        icon: "mdi:shield"
        name: Secure
        color: "red"
      entity_4:
        nav: "network"
        icon: "mdi:nas"
        name: Lab
        color: "purple"
      entity_5:
        nav: "network"
        icon: "mdi:flask"
        name: Lab
        color: "red"

  - type: "horizontal-stack"
    cards:
      - type: "custom:button-card"
        template: card_person
        entity: person.rick_fox
        variables:
          ulm_card_person_entity: person.rick_fox
          ulm_card_person_use_entity_picture: true
      - type: "custom:button-card"
        template: card_person
        entity: person.tracy_fox
        variables:
          ulm_card_person_entity: person.tracy_fox
          ulm_card_person_use_entity_picture: true

  - type: "horizontal-stack"
    cards:
      - type: "custom:button-card"
        template:
          - card_esh_room
          - green_on
        name: Living Room
        entity: light.tv_leds
        icon: mdi:sofa-single
        tap_action:
          action: navigate
          navigation_path: "living_room"
        variables:
          ulm_custom_card_esh_room_light_entity: light.tv_leds
        #          ulm_custom_card_esh_room_climate_entity: sensor.living_room_temperature
        #        label: '[[[ return states["sensor.garage_temperature_2"].state + "°F" ]]]'
        label: >
          [[[
            return "🌡️ " + states['sensor.living_room_temperature'].state + " °C" + " 💧 " + states['sensor.living_room_humidity'].state + " %"
          ]]]
      - type: "custom:button-card"
        template:
          - card_esh_room
          - green_on
        name: Office
        entity: light.tv_leds
        icon: mdi:sofa-single
        tap_action:
          action: navigate
          navigation_path: "office"
        variables:
          ulm_custom_card_esh_room_light_entity: light.tv_leds
        #          ulm_custom_card_esh_room_climate_entity: sensor.living_room_temperature
        #        label: '[[[ return states["sensor.garage_temperature_2"].state + "°F" ]]]'
        label: >
          [[[
            return "🌡️ " + states['sensor.living_room_temperature'].state + " °C" + " 💧 " + states['sensor.living_room_humidity'].state + " %"
          ]]]

  - type: "custom:button-card"
    template:
      - card_room
      - red_no_state
    name: Office
    entity: sensor.office_motion_device_temperature
    icon: mdi:desk
    tap_action:
      action: navigate
      navigation_path: '/ui-lovelace-minimalist/bathroom'
    variables:
      label_use_temperature: true
      label_use_brightness: true
      entity_1:
        entity_id: binary_sensor.office_motion_occupancy
        templates:
          - yellow_on
        tap_action:
          action: toggle
      entity_2:
        entity_id: binary_sensor.office_chair_contact
        templates:
          - blue_on
        tap_action:
          action: none
      entity_3:
        entity_id: input_boolean.office_occupied
        templates:
          - green_on
          - red_off
        tap_action:
          action: toggle
    rooms: