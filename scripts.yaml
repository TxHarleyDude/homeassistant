kodi_change_profile:
  alias: Kodi Get Profile
  sequence:
  - action: kodi.call_method
    data:
      method: Profiles.GetCurrentProfile
    target:
      entity_id: media_player.kodi_55bb9cd19766a793200ff5da7bbcb966
  mode: single
set_kodi_profile_patio:
  alias: Set Kodi Profile Patio
  sequence:
  - action: kodi.call_method
    data:
      method: Profiles.LoadProfile
      profile: Patio
    target:
      entity_id: media_player.kodi_55bb9cd19766a793200ff5da7bbcb966
  mode: single
set_kodi_profile_master_user:
  alias: Set Kodi Profile Living Room
  sequence:
  - action: kodi.call_method
    target:
      entity_id: media_player.kodi_55bb9cd19766a793200ff5da7bbcb966
    data:
      method: Profiles.LoadProfile
      profile: Master user
  mode: single
kodi_get_playlists:
  alias: Kodi Get Playlists
  sequence:
  - action: kodi.call_method
    target:
      entity_id: media_player.kodi_55bb9cd19766a793200ff5da7bbcb966
    data:
      method: Playlist.GetPlaylists
  mode: single
  icon: mdi:playlist-edit
kodi_load_good_stuff:
  sequence:
  - action: kodi.call_method
    data:
      method: Application.SetVolume
      volume: 50
    target:
      area_id: office
      device_id: da3997006f06f7dc6763adf9780464b6
  - action: kodi.call_method
    data:
      method: Playlist.Clear
      playlistid: 0
    target:
      area_id: office
      device_id: da3997006f06f7dc6763adf9780464b6
  - action: kodi.call_method
    data:
      method: Playlist.Add
      playlistid: 0
      item:
        recursive: true
        directory: special://profile/playlists/music/Good Stuff.m3u
    target:
      area_id: office
      device_id: da3997006f06f7dc6763adf9780464b6
  - action: kodi.call_method
    data:
      method: Player.Open
      item:
        playlistid: 0
        position: 0
    target:
      area_id: office
      device_id: da3997006f06f7dc6763adf9780464b6
  - action: kodi.call_method
    data:
      method: Input.ButtonEvent
      button: TAB
      keymap: KB
    target:
      area_id: office
      device_id: da3997006f06f7dc6763adf9780464b6
  mode: single
  alias: Kodi - Load Good Stuff - Office
  icon: mdi:playlist-play
